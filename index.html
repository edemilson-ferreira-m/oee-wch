<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>OEE WCH - Online</title>

<style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:20px}
input,button{padding:10px;margin:5px;border-radius:6px;border:none}
button{background:#2563eb;color:#fff;font-weight:bold}
.card{background:#111827;padding:20px;border-radius:12px;margin-bottom:20px}
</style>

</head>
<body>

<h1>OEE WCH - ONLINE 🔥</h1>

<div class="card">
<h3>Lançamento</h3>

<input type="date" id="data"><br>
<input type="text" id="maquina" placeholder="Máquina"><br>
<input type="text" id="operador" placeholder="Operador"><br>

<input type="number" id="tempoDisponivel" placeholder="Tempo turno (min)" value="525"><br>
<input type="number" id="tempoCiclo" placeholder="Tempo ciclo (seg)" value="60"><br>

<input type="number" id="qtdProduzida" placeholder="Produzido"><br>
<input type="number" id="pecasRuins" placeholder="Peças ruins"><br>

<input type="number" id="parada" placeholder="Parada não planejada (min)"><br>

<button onclick="salvar()">Salvar</button>

<p id="resultado"></p>
</div>

<div class="card">
<h3>Dashboard</h3>
<div id="dados"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://oee-wch-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function salvar(){

let data = document.getElementById("data").value;
let maquina = document.getElementById("maquina").value;
let operador = document.getElementById("operador").value;

let tempoDisponivel = Number(document.getElementById("tempoDisponivel").value);
let tempoCiclo = Number(document.getElementById("tempoCiclo").value);

let qtdProduzida = Number(document.getElementById("qtdProduzida").value);
let pecasRuins = Number(document.getElementById("pecasRuins").value);
let parada = Number(document.getElementById("parada").value);

let boas = qtdProduzida - pecasRuins;
let tempoOperacional = tempoDisponivel - parada;

let prodTeorica = (tempoOperacional * 60) / tempoCiclo;

let disp = tempoOperacional / tempoDisponivel;
let perf = qtdProduzida / prodTeorica;
let qual = boas / qtdProduzida;

if(perf > 1) perf = 1;

let oee = disp * perf * qual;

push(ref(db,"lancamentos"),{
data,maquina,operador,
qtdProduzida,pecasRuins,
tempoDisponivel,tempoCiclo,parada,
oee:oee*100
});

document.getElementById("resultado").innerText =
"OEE: " + (oee*100).toFixed(2) + "%";

}

onValue(ref(db,"lancamentos"),(snapshot)=>{
let dados = snapshot.val();
let html = "";

for(let key in dados){
let d = dados[key];
html += `<p>${d.data} | ${d.maquina} | ${d.operador} | OEE: ${d.oee.toFixed(1)}%</p>`;
}

document.getElementById("dados").innerHTML = html;

});

</script>

</body>
</html>
